version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./.next:/app/.next
    environment:
      WATCHPACK_POLLING: "true"
    working_dir: /app
    command: sh -c "yarn install && yarn dev"
    restart: unless-stopped
